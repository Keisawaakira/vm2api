# 本地/开发构建覆盖层。发行安装只用 docker-compose.yml（纯拉镜像）。
# 用法: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  vm2api:
    # Separate from old release .env values; never pull an upstream image over this build.
    image: ${VM2API_BUILD_IMAGE:-vm2api-fork:local}
    pull_policy: never
    labels:
      org.opencontainers.image.revision: ${VM2API_SOURCE_REVISION:-unknown}
    build:
      context: .
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.revision: ${VM2API_SOURCE_REVISION:-unknown}
